<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="闪光精灵球">
  <!-- 路闪监测专属图标：一枚精灵球 + 两颗金色闪光星（游戏里闪光的记号） -->
  <defs>
    <linearGradient id="sbRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f63"/>
      <stop offset="1" stop-color="#cf2b31"/>
    </linearGradient>
    <linearGradient id="sbWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dde9"/>
    </linearGradient>
    <clipPath id="sbClip"><circle cx="16" cy="16" r="13"/></clipPath>
  </defs>
  <g clip-path="url(#sbClip)">
    <rect x="3" y="3" width="26" height="13" fill="url(#sbRed)"/>
    <rect x="3" y="16" width="26" height="13" fill="url(#sbWhite)"/>
    <rect x="3" y="14.6" width="26" height="2.8" fill="#242a3c"/>
    <path d="M4 6a13 13 0 0 1 8-2.6" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#242a3c" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="4.5" fill="#ffffff" stroke="#242a3c" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="2" fill="#eef2f8" stroke="#242a3c" stroke-width=".8"/>
  <path d="M26.5 1.6l1.25 3.35 3.35 1.25-3.35 1.25-1.25 3.35-1.25-3.35-3.35-1.25 3.35-1.25z" fill="#ffd84a" stroke="#a8790a" stroke-width=".6" stroke-linejoin="round"/>
  <path d="M4.2 23.4l.78 2.05 2.05.78-2.05.78-.78 2.05-.78-2.05-2.05-.78 2.05-.78z" fill="#ffe680" stroke="#b58a12" stroke-width=".5" stroke-linejoin="round"/>
